name: Prepare release PR

# Creates a release/vX.Y.Z branch from develop that bumps the module version in
# postishipping.php and adds a CHANGELOG.md section generated from the commits
# since the last release tag, then opens a PR into develop.
#
# Leave "version" empty to calculate it from the commits (Conventional Commits:
# feat -> minor, fix/other -> patch, "type!:" or "BREAKING CHANGE" -> major),
# or force a bump type / enter an exact version.
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to create
# and approve pull requests" to be enabled.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version (X.Y.Z). Leave empty to calculate automatically.'
        required: false
        default: ''
      bump:
        description: 'Bump type used when version is empty'
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Bump version and update changelog
        id: prep
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: bash .github/scripts/prepare-release.sh "$INPUT_VERSION" "$INPUT_BUMP"

      - name: Commit, push and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prep.outputs.version }}
          LAST_TAG: ${{ steps.prep.outputs.last_tag }}
        run: |
          BRANCH="release/v$VERSION"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            echo "::error::Branch $BRANCH already exists. Merge or delete it first."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add postishipping/postishipping.php postishipping/CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push origin "$BRANCH"

          {
            echo "Bumps the module version to **$VERSION** (previous release: ${LAST_TAG:-none})."
            echo
            echo "### CHANGELOG.md"
            echo
            cat release-notes.md
            echo
            echo "---"
            echo "Review/edit the changelog in this PR if needed. After merging, merge develop into main and run **Deploy tag and release**."
          } > pr-body.md

          gh pr create --base develop --head "$BRANCH" \
            --title "Release v$VERSION" --body-file pr-body.md

          {
            echo "## Release v$VERSION prepared"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
